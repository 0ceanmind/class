<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>

<script>
/* =====================================================
   ✏️  EDIT ME  —  change ONLY the values between the quotes
   Do not touch anything below the "STOP" line.
   ===================================================== */

// ---- Step 4 on the slide: change these 3 ----
var NAME    = "Your Name";
var TAGLINE = "Future developer. Learning Git & GitHub!";
var ABOUT   = "Write one or two lines about you here. What do you love? What do you want to build?";

// ---- Bonus: make it yours ----
var EMOJI           = "🚀";          // any emoji you like
var ACCENT_COLOR    = "#17e5ee";     // try: "#ff5c8a"  "#ffb84d"  "#7cff6b"  "#a78bfa"
var GITHUB_USERNAME = "";            // your GitHub username (shows your photo)
var EMAIL           = "";            // optional, e.g. "me@example.com"

var SKILLS = ["HTML", "CSS", "Git", "GitHub"];   // add more: "Python", "Design", ...

var PROJECTS = [
  { title: "My first website", text: "Built in Week 4 using GitHub.", link: "" },
  { title: "Project two",      text: "Coming soon...",               link: "" }
];

/* =============== STOP — do not edit below =============== */
</script>

<style>
  :root { --accent: #17e5ee; --bg: #00111c; --card: #04202c; --text: #e6fbff; --muted: #7fb3bd; }
  body.light { --bg: #f5fbfc; --card: #ffffff; --text: #0b2530; --muted: #4c6f79; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; transition: background .3s, color .3s; }
  nav { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 6%; background: var(--bg); border-bottom: 1px solid var(--card); z-index: 10; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 15px; }
  nav a:hover { color: var(--accent); }
  nav .logo { font-weight: 700; color: var(--accent); margin: 0; font-size: 18px; }
  #theme { background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 20px; padding: 4px 12px; cursor: pointer; margin-left: 18px; }
  section { padding: 70px 6%; max-width: 1000px; margin: 0 auto; }
  .hero { text-align: center; padding-top: 90px; }
  .avatar { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 40%, transparent); }
  .emoji { font-size: 90px; }
  h1 { font-size: clamp(34px, 7vw, 60px); margin: 14px 0 4px; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: clamp(16px, 3vw, 22px); min-height: 34px; }
  .cursor { color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .btn { display: inline-block; margin-top: 22px; padding: 12px 28px; background: var(--accent); color: #00111c; border-radius: 30px; font-weight: 700; text-decoration: none; transition: transform .2s; }
  .btn:hover { transform: scale(1.06); }
  h2 { font-size: 30px; margin: 0 0 18px; }
  h2::after { content: ""; display: block; width: 50px; height: 4px; background: var(--accent); margin-top: 8px; border-radius: 2px; }
  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .skill { padding: 8px 18px; border: 1px solid var(--accent); border-radius: 20px; color: var(--accent); transition: background .2s, color .2s; }
  .skill:hover { background: var(--accent); color: #00111c; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 14px; padding: 22px; color: inherit; text-decoration: none; display: block; transition: transform .2s, border-color .2s; }
  .card:hover { transform: translateY(-6px); border-color: var(--accent); }
  .card h3 { margin: 0 0 6px; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); }
  footer { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .7s, transform .7s; }
  .reveal.show { opacity: 1; transform: none; }
</style>
</head>

<body>
  <nav>
    <p class="logo" id="logo"></p>
    <div>
      <a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a>
      <button id="theme">🌙</button>
    </div>
  </nav>

  <section class="hero">
    <div id="pic"></div>
    <h1>Hi, I'm <span id="name"></span></h1>
    <div class="tagline"><span id="tagline"></span><span class="cursor">|</span></div>
    <a class="btn" id="contact" href="#about">Get to know me</a>
  </section>

  <section id="about" class="reveal"><h2>About me</h2><p id="about-text"></p></section>
  <section id="skills" class="reveal"><h2>Skills</h2><div class="skills" id="skill-list"></div></section>
  <section id="projects" class="reveal"><h2>Projects</h2><div class="grid" id="project-list"></div></section>

  <footer id="footer"></footer>

<script>
  // ---- Everything below builds the page from your variables ----
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function $(id) { return document.getElementById(id); }

  document.documentElement.style.setProperty("--accent", ACCENT_COLOR);
  document.title = NAME + " | Portfolio";
  $("logo").textContent = EMOJI + " " + NAME;
  $("name").textContent = NAME;
  $("about-text").textContent = ABOUT;
  $("footer").textContent = "Made by " + NAME + " with Git & GitHub " + EMOJI;

  // picture: GitHub avatar if username given, otherwise the emoji
  if (GITHUB_USERNAME) {
    var img = el("img", "avatar");
    img.src = "https://github.com/" + encodeURIComponent(GITHUB_USERNAME) + ".png?size=260";
    img.alt = NAME;
    img.onerror = function () { $("pic").replaceChildren(el("div", "emoji", EMOJI)); };
    $("pic").appendChild(img);
  } else {
    $("pic").appendChild(el("div", "emoji", EMOJI));
  }

  // contact button
  if (EMAIL) {
    $("contact").href = "mailto:" + EMAIL;
    $("contact").textContent = "Contact me";
  }

  // skills
  SKILLS.forEach(function (s) { $("skill-list").appendChild(el("span", "skill", s)); });

  // projects
  PROJECTS.forEach(function (p) {
    var card = el(p.link ? "a" : "div", "card");
    if (p.link) { card.href = p.link; card.target = "_blank"; card.rel = "noopener"; }
    card.appendChild(el("h3", "", p.title));
    card.appendChild(el("p", "", p.text));
    $("project-list").appendChild(card);
  });

  // typing effect for the tagline
  var i = 0;
  (function type() {
    $("tagline").textContent = TAGLINE.slice(0, i++);
    if (i <= TAGLINE.length) setTimeout(type, 55);
  })();

  // dark / light button
  $("theme").onclick = function () {
    document.body.classList.toggle("light");
    $("theme").textContent = document.body.classList.contains("light") ? "☀️" : "🌙";
  };

  // fade-in sections while scrolling
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("show"); });
  }, { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach(function (s) { obs.observe(s); });
</script>
</body>
</html>
